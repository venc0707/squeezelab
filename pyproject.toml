[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "squeezelab"
version = "0.0.1"
description = "SqueezeLab: торговый бот для BingX USDT-M perpetual (детектор поджимов на Williams %R)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "pyarrow>=26.0.1,<27",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.7,<3",
    "pyyaml>=6.0,<7",
]

[project.scripts]
squeezelab = "squeezelab.app.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "ruff>=0.5",
    "types-pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/squeezelab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: нужен доступ к сети или ключам; в обычный прогон не входит",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT"]
# RUF001-003: кириллица в строках и комментариях помечается как «похожие символы»
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# S603 и S607: тесты deploy/ запускают bash и systemd-analyze с фиксированными аргументами
"tests/**" = ["S101", "S105", "S106", "S603", "S607"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

# pyarrow не поставляет типов; границу с ним изолирует data/store.py.
[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
